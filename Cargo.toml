[package]
name = "malvision"
version = "1.0.1"
edition = "2024"
description = "Application native Windows 11 x64 de gestion de connexions distantes (RDP intégré, AnyDesk, RustDesk)"
authors = ["Malvirae"]
publish = false

[[bin]]
name = "Malvision"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
